<!DOCTYPE html>

<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Qiita Article Index</title>


<style>

/* ==========================================================
   Variables
========================================================== */

:root {

    --columns: 2;

    --bg: #f7f9f8;
    --surface: #ffffff;

    --text: #252826;
    --subtext: #717873;

    --border: #e1e6e3;

    --soft: #f1f4f2;
    --soft-hover: #e8edea;

    --accent: #55c500;
    --accent-dark: #438f20;
    --accent-soft: #eef9e9;

}


/* ==========================================================
   Base
========================================================== */

* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {

    margin: 0;

    background:
        var(--bg);

    color:
        var(--text);

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans JP",
        "Helvetica Neue",
        Arial,
        sans-serif;

    line-height:
        1.7;

}

button,
input,
select {
    font: inherit;
}


/* ==========================================================
   Layout
========================================================== */

.container {

    width:
        min(
            1600px,
            100%
        );

    margin:
        0 auto;

    padding:
        40px 26px 90px;

}


/* ==========================================================
   Header
========================================================== */

.header {

    margin-bottom:
        27px;

}

.header-top {

    display:
        flex;

    align-items:
        center;

    flex-wrap:
        wrap;

    gap:
        12px;

}

h1 {

    margin:
        0;

    font-size:
        clamp(
            28px,
            4vw,
            38px
        );

    line-height:
        1.2;

    letter-spacing:
        -0.035em;

}

.author {

    padding:
        4px 10px;

    border-radius:
        999px;

    background:
        var(--accent-soft);

    color:
        var(--accent-dark);

    font-size:
        12px;

    font-weight:
        650;

}

.description {

    margin:
        10px 0 0;

    color:
        var(--subtext);

    font-size:
        15px;

}

.header-info {

    display:
        flex;

    gap:
        8px;

    align-items:
        center;

    margin-top:
        10px;

    color:
        #959b97;

    font-size:
        12px;

}


/* ==========================================================
   Toolbar
========================================================== */

.toolbar-wrapper {

    position:
        sticky;

    top:
        0;

    z-index:
        100;

    margin:
        0 -10px 18px;

    padding:
        10px;

    background:
        rgba(
            247,
            249,
            248,
            .94
        );

    backdrop-filter:
        blur(12px);

    -webkit-backdrop-filter:
        blur(12px);

}

.toolbar {

    display:
        grid;

    grid-template-columns:
        minmax(270px, 1fr)
        auto
        auto
        auto
        auto;

    gap:
        8px;

    align-items:
        stretch;

}


/* ==========================================================
   Search
========================================================== */

.search-wrap {

    position:
        relative;

    min-width:
        0;

}

.search-icon {

    position:
        absolute;

    left:
        16px;

    top:
        50%;

    transform:
        translateY(-50%);

    color:
        #989f9a;

    pointer-events:
        none;

}

.search {

    width:
        100%;

    height:
        50px;

    padding:
        0 16px 0 42px;

    border:
        1px solid
        var(--border);

    border-radius:
        14px;

    outline:
        none;

    background:
        var(--surface);

    color:
        var(--text);

    font-size:
        15px;

}

.search:focus {

    border-color:
        #9dcb89;

    box-shadow:
        0 0 0 4px
        rgba(
            85,
            197,
            0,
            .09
        );

}


/* ==========================================================
   Controls
========================================================== */

.control {

    min-height:
        44px;

    padding:
        0 13px;

    border:
        1px solid
        var(--border);

    border-radius:
        11px;

    outline:
        none;

    background:
        var(--surface);

    color:
        var(--text);

    font-size:
        13px;

}

.toggle-control {

    display:
        flex;

    align-items:
        center;

    justify-content:
        space-between;

    gap:
        9px;

    min-height:
        50px;

    padding:
        0 12px;

    border:
        1px solid
        var(--border);

    border-radius:
        12px;

    background:
        var(--surface);

    white-space:
        nowrap;

    font-size:
        12px;

}


/* ==========================================================
   Toggle
========================================================== */

.switch {

    position:
        relative;

    display:
        inline-block;

    width:
        38px;

    height:
        22px;

    flex-shrink:
        0;

}

.switch input {

    opacity:
        0;

    width:
        0;

    height:
        0;

}

.slider {

    position:
        absolute;

    inset:
        0;

    cursor:
        pointer;

    border-radius:
        999px;

    background:
        #d8ddda;

    transition:
        .2s;

}

.slider::before {

    content:
        "";

    position:
        absolute;

    width:
        16px;

    height:
        16px;

    top:
        3px;

    left:
        3px;

    border-radius:
        50%;

    background:
        #ffffff;

    box-shadow:
        0 1px 4px
        rgba(
            0,
            0,
            0,
            .15
        );

    transition:
        .2s;

}

.switch input:checked
+ .slider {

    background:
        var(--accent);

}

.switch input:checked
+ .slider::before {

    transform:
        translateX(16px);

}


/* ==========================================================
   Reading Explorer
========================================================== */

.reading-explorer {

    margin:
        4px 0 22px;

    padding:
        18px 20px 16px;

    border:
        1px solid
        var(--border);

    border-radius:
        16px;

    background:
        var(--surface);

}

.reading-header {

    display:
        flex;

    justify-content:
        space-between;

    align-items:
        flex-end;

    gap:
        16px;

    margin-bottom:
        14px;

}

.reading-title {

    font-size:
        13px;

    font-weight:
        700;

}

.reading-description {

    margin-top:
        2px;

    color:
        var(--subtext);

    font-size:
        11px;

}

.reading-range-label {

    color:
        var(--accent-dark);

    font-size:
        13px;

    font-weight:
        700;

    white-space:
        nowrap;

}


/* ==========================================================
   Histogram
========================================================== */

.histogram {

    display:
        flex;

    align-items:
        flex-end;

    gap:
        3px;

    height:
        76px;

    margin:
        0 4px;

}

.histogram-bar {

    flex:
        1 1 0;

    min-width:
        2px;

    border-radius:
        3px 3px 1px 1px;

    background:
        #dfe4e1;

    transition:
        background .15s,
        opacity .15s;

}

.histogram-bar.selected {

    background:
        var(--accent);

}

.histogram-bar.dim {

    opacity:
        .35;

}


/* ==========================================================
   Dual range
========================================================== */

.range-area {

    position:
        relative;

    height:
        42px;

    margin-top:
        4px;

}

.range-track {

    position:
        absolute;

    left:
        6px;

    right:
        6px;

    top:
        16px;

    height:
        7px;

    border-radius:
        999px;

    background:
        #e3e7e4;

}

.range-selected {

    position:
        absolute;

    top:
        0;

    bottom:
        0;

    border-radius:
        999px;

    background:
        var(--accent);

}

.range-input {

    position:
        absolute;

    left:
        0;

    top:
        7px;

    width:
        100%;

    height:
        24px;

    margin:
        0;

    appearance:
        none;

    -webkit-appearance:
        none;

    pointer-events:
        none;

    background:
        transparent;

}

.range-input::-webkit-slider-runnable-track {

    height:
        7px;

    background:
        transparent;

}

.range-input::-webkit-slider-thumb {

    appearance:
        none;

    -webkit-appearance:
        none;

    width:
        22px;

    height:
        22px;

    margin-top:
        -7px;

    border:
        3px solid #fff;

    border-radius:
        50%;

    background:
        var(--accent);

    box-shadow:
        0 1px 5px
        rgba(
            0,
            0,
            0,
            .22
        );

    pointer-events:
        auto;

    cursor:
        grab;

}

.range-input::-webkit-slider-thumb:active {

    cursor:
        grabbing;

}

.range-input::-moz-range-track {

    height:
        7px;

    background:
        transparent;

}

.range-input::-moz-range-thumb {

    width:
        16px;

    height:
        16px;

    border:
        3px solid #fff;

    border-radius:
        50%;

    background:
        var(--accent);

    box-shadow:
        0 1px 5px
        rgba(
            0,
            0,
            0,
            .22
        );

    pointer-events:
        auto;

}


/* ==========================================================
   Histogram axis
========================================================== */

.histogram-axis {

    display:
        flex;

    justify-content:
        space-between;

    gap:
        4px;

    margin:
        -3px 3px 0;

    color:
        #9a9f9c;

    font-size:
        10px;

}

.histogram-footer {

    display:
        flex;

    justify-content:
        space-between;

    align-items:
        center;

    gap:
        12px;

    margin-top:
        10px;

}

.histogram-count {

    color:
        var(--subtext);

    font-size:
        11px;

}

.histogram-reset {

    border:
        0;

    background:
        transparent;

    color:
        var(--accent-dark);

    cursor:
        pointer;

    font-size:
        11px;

}


/* ==========================================================
   Reset
========================================================== */

.reset {

    cursor:
        pointer;

    color:
        var(--subtext);

}

.reset:hover {

    background:
        var(--soft);

}


/* ==========================================================
   Result
========================================================== */

.result-bar {

    display:
        flex;

    justify-content:
        space-between;

    align-items:
        center;

    gap:
        18px;

    margin:
        0 2px 17px;

    color:
        var(--subtext);

    font-size:
        13px;

}

.count {

    color:
        #555c58;

    font-weight:
        650;

}

.search-hint {

    color:
        #999f9b;

    font-size:
        12px;

}


/* ==========================================================
   Grid
========================================================== */

.articles {

    display:
        grid;

    grid-template-columns:
        repeat(
            var(--columns),
            minmax(
                0,
                1fr
            )
        );

    gap:
        15px;

    align-items:
        stretch;

}


/* ==========================================================
   Card
========================================================== */

.article-card {

    position:
        relative;

    display:
        flex;

    flex-direction:
        column;

    min-width:
        0;

    padding:
        21px;

    overflow:
        hidden;

    border:
        1px solid
        var(--border);

    border-radius:
        17px;

    background:
        var(--surface);

    box-shadow:
        0 1px 3px
        rgba(
            0,
            0,
            0,
            .018
        );

    transition:
        transform .18s,
        border-color .18s,
        box-shadow .18s;

}

.article-card::before {

    content:
        "";

    position:
        absolute;

    top:
        0;

    left:
        18px;

    right:
        18px;

    height:
        3px;

    border-radius:
        0 0 4px 4px;

    background:
        transparent;

}

.article-card:hover {

    transform:
        translateY(-2px);

    border-color:
        #cad2cd;

    box-shadow:
        0 8px 25px
        rgba(
            0,
            0,
            0,
            .055
        );

}

.article-card:hover::before {

    background:
        var(--accent);

}


/* ==========================================================
   Title
========================================================== */

.article-title {

    margin:
        0 0 13px;

    min-width:
        0;

    font-size:
        17px;

    line-height:
        1.53;

    letter-spacing:
        -0.01em;

    overflow-wrap:
        anywhere;

}

.article-title a {

    color:
        var(--text);

    text-decoration:
        none;

}

.article-title a:hover {

    color:
        var(--accent-dark);

}

.external {

    color:
        #9da39f;

    font-size:
        11px;

    white-space:
        nowrap;

}


/* ==========================================================
   Abstract
========================================================== */

.abstract {

    flex-grow:
        1;

    min-width:
        0;

    margin:
        0 0 20px;

    color:
        #515854;

    font-size:
        14px;

    line-height:
        1.78;

}

.ai-label {

    display:
        inline-block;

    margin-right:
        7px;

    padding:
        1px 6px;

    border-radius:
        5px;

    background:
        var(--accent-soft);

    color:
        var(--accent-dark);

    font-size:
        9px;

    font-weight:
        750;

    letter-spacing:
        .06em;

}


/* ==========================================================
   Meta
========================================================== */

.meta {

    width:
        100%;

    margin-top:
        auto;

}

.tags {

    display:
        flex;

    flex-wrap:
        wrap;

    gap:
        6px;

}

.tag {

    max-width:
        100%;

    padding:
        4px 9px;

    border:
        0;

    border-radius:
        999px;

    background:
        var(--soft);

    color:
        #626964;

    cursor:
        pointer;

    font-size:
        11px;

}

.tag:hover {

    background:
        var(--accent-soft);

    color:
        var(--accent-dark);

}


/* ==========================================================
   Card reading barometer
========================================================== */

.reading-weight {

    margin-top:
        13px;

}

.reading-weight-top {

    display:
        flex;

    justify-content:
        space-between;

    align-items:
        center;

    gap:
        10px;

    margin-bottom:
        5px;

    color:
        #8d948f;

    font-size:
        11px;

}

.reading-weight-name {

    color:
        var(--accent-dark);

    font-weight:
        650;

}

.reading-mini-track {

    position:
        relative;

    height:
        5px;

    border-radius:
        999px;

    background:
        #e4e8e5;

}

.reading-mini-fill {

    position:
        absolute;

    left:
        0;

    top:
        0;

    bottom:
        0;

    border-radius:
        999px;

    background:
        var(--accent);

}

.reading-mini-dot {

    position:
        absolute;

    top:
        50%;

    width:
        9px;

    height:
        9px;

    transform:
        translate(
            -50%,
            -50%
        );

    border:
        2px solid #fff;

    border-radius:
        50%;

    background:
        var(--accent);

    box-shadow:
        0 1px 3px
        rgba(
            0,
            0,
            0,
            .2
        );

}

.reading-char-label {

    margin-top:
        4px;

    color:
        #a0a6a2;

    font-size:
        10px;

}


/* ==========================================================
   Date
========================================================== */

.date-row {

    display:
        flex;

    justify-content:
        flex-end;

    width:
        100%;

    margin-top:
        10px;

    padding-top:
        9px;

    border-top:
        1px solid
        #f0f2f1;

}

time {

    color:
        #999f9b;

    font-size:
        11px;

    white-space:
        nowrap;

}


/* ==========================================================
   Visibility
========================================================== */

body.hide-abstract
.abstract {

    display:
        none;

}

body.hide-meta
.meta {

    display:
        none;

}


/* ==========================================================
   Column sizes
========================================================== */

html[data-columns="1"]
.article-card {

    padding:
        27px 30px;

}

html[data-columns="1"]
.article-title {

    font-size:
        20px;

}

html[data-columns="1"]
.abstract {

    font-size:
        15px;

}


html[data-columns="4"] .article-card,
html[data-columns="5"] .article-card,
html[data-columns="6"] .article-card {

    padding:
        17px;

}

html[data-columns="4"] .article-title,
html[data-columns="5"] .article-title,
html[data-columns="6"] .article-title {

    font-size:
        15.5px;

}

html[data-columns="4"] .abstract,
html[data-columns="5"] .abstract,
html[data-columns="6"] .abstract {

    font-size:
        13px;

}


/* ==========================================================
   Highlight
========================================================== */

mark {

    padding:
        0 .08em;

    border-radius:
        3px;

    background:
        #e8f7df;

    color:
        inherit;

}


/* ==========================================================
   Empty
========================================================== */

.empty {

    display:
        none;

    padding:
        80px 20px;

    text-align:
        center;

    color:
        var(--subtext);

}

.empty.show {

    display:
        block;

}


/* ==========================================================
   Back to top
========================================================== */

.back-top {

    position:
        fixed;

    right:
        22px;

    bottom:
        22px;

    z-index:
        90;

    width:
        42px;

    height:
        42px;

    border:
        1px solid
        var(--border);

    border-radius:
        50%;

    background:
        rgba(
            255,
            255,
            255,
            .95
        );

    color:
        #68706b;

    cursor:
        pointer;

    opacity:
        0;

    pointer-events:
        none;

    box-shadow:
        0 4px 18px
        rgba(
            0,
            0,
            0,
            .08
        );

}

.back-top.show {

    opacity:
        1;

    pointer-events:
        auto;

}


/* ==========================================================
   Medium
========================================================== */

@media (
    max-width: 1100px
) {

    .toolbar {

        grid-template-columns:
            1fr
            auto
            auto;

    }

    .search-wrap {

        grid-column:
            1 / -1;

    }

}


/* ==========================================================
   Narrow
========================================================== */

@media (
    max-width: 760px
) {

    .view-control {

        display:
            none;

    }

    .container {

        padding:
            25px 14px 60px;

    }

    .toolbar-wrapper {

        margin:
            0 -6px 15px;

        padding:
            7px 6px;

    }

    .toolbar {

        grid-template-columns:
            1fr
            1fr;

    }

    .search-wrap {

        grid-column:
            1 / -1;

    }

    .reset {

        grid-column:
            1 / -1;

    }

    .reading-header {

        display:
            block;

    }

    .reading-range-label {

        margin-top:
            7px;

    }

    .histogram {

        height:
            58px;

    }

    .result-bar {

        display:
            block;

    }

    .search-hint {

        display:
            none;

    }

}


/* ==========================================================
   Refined Qiita-style interface
========================================================== */

:root {
    --bg: #f6f8f7;
    --surface: #ffffff;
    --text: #242827;
    --subtext: #66706b;
    --muted: #8c9691;
    --border: #dfe5e1;
    --border-strong: #cad4ce;
    --soft: #f2f5f3;
    --soft-hover: #e9eeeb;
    --accent: #55c500;
    --accent-dark: #347a16;
    --accent-soft: #edf8e8;
    --focus: rgba(85, 197, 0, .18);
}

body {
    background: var(--bg);
    font-feature-settings: "palt" 1;
}

.container {
    width: min(1480px, 100%);
    padding: clamp(24px, 4vw, 48px) clamp(14px, 3vw, 32px) 88px;
}

.header {
    margin-bottom: 22px;
}

.header-top {
    gap: 10px;
}

h1 {
    font-size: clamp(25px, 3vw, 34px);
    letter-spacing: -.025em;
}

.description {
    margin-top: 8px;
    font-size: 14px;
}

.header-info {
    margin-top: 7px;
    color: var(--muted);
}

.toolbar-wrapper {
    margin: 0 -8px 16px;
    padding: 8px;
    background: rgba(246, 248, 247, .93);
}

.toolbar {
    display: grid;
    grid-template-columns: minmax(320px, 1fr) auto auto;
    gap: 8px;
    align-items: stretch;
}

.display-controls,
.utility-controls {
    display: flex;
    min-width: 0;
    gap: 8px;
}

.search {
    height: 52px;
    padding-left: 45px;
    border-color: var(--border-strong);
    border-radius: 10px;
    box-shadow: 0 1px 2px rgba(25, 35, 29, .025);
    font-size: 15px;
}

.search-icon {
    left: 17px;
    color: #75817a;
    font-size: 22px;
    line-height: 1;
}

.search:focus-visible,
.control:focus-visible,
.tag:focus-visible,
.histogram-reset:focus-visible,
.reset:focus-visible,
.back-top:focus-visible {
    border-color: var(--accent);
    outline: 3px solid var(--focus);
    outline-offset: 1px;
}

.toggle-control,
.control {
    min-height: 52px;
    border-radius: 9px;
}

.toggle-control {
    padding: 0 12px;
    color: #46504b;
    font-weight: 600;
}

.control {
    padding: 0 12px;
}

.reset {
    border-color: #d7ddd9;
    color: #5f6964;
    white-space: nowrap;
}

.reset:hover,
.reset:active {
    background: #eef2ef;
    color: #343b37;
}

.reading-explorer {
    margin: 0 0 17px;
    padding: 20px 22px 16px;
    border-color: #d8e2dc;
    border-radius: 12px;

<div class="container">

     Header

280 articles

<span>·</span>

<span>
AI-powered index
</span>

</div>

<div class="toolbar-wrapper">

<span class="search-icon">
⌕
</span>

</div>

<div>

/* =========================================================

function loadSetting(
    key,
    fallback
) {

    try {

        const value =
            localStorage.getItem(
                "qiita-index-" + key
            );

        return (
            value === null
            ? fallback
            : value
        );

    } catch (_) {

        return fallback;

    }

}


function saveSetting(
    key,
    value
) {

    try {

        localStorage.setItem(
            "qiita-index-" + key,
            value
        );

    } catch (_) {

    }

}


/* =========================================================
   Reading conversion
========================================================= */

function sliderToChars(
    sliderValue
) {

    if (
        DATA_MAX === DATA_MIN
    ) {

        return DATA_MAX;

    }


    const t =
        Number(
            sliderValue
        )
        / 1000;


    return Math.round(
        DATA_MIN
        +
        t
        * (
            DATA_MAX
            - DATA_MIN
        )
    );

}


function charsToSlider(
    chars
) {

    if (
        DATA_MAX === DATA_MIN
    ) {

        return 0;

    }


    const t =
        (
            chars
            - DATA_MIN
        )
        /
        (
            DATA_MAX
            - DATA_MIN
        );


    return Math.max(
        0,
        Math.min(
            1000,
            Math.round(
                t * 1000
            )
        )
    );

}


/* =========================================================
   Number display
========================================================= */

function formatChars(
    value
) {

    if (
        value >= 10000
    ) {

        return (
            (
                value / 10000
            ).toFixed(
                value >= 100000
                ? 0
                : 1
            )
            + "万字"
        );

    }


    if (
        value >= 1000
    ) {

        return (
            (
                value / 1000
            ).toFixed(
                1
            )
            + "k字"
        );

    }


    return (
        value.toLocaleString()
        + "字"
    );

}


/* =========================================================
   Normalize
========================================================= */

function normalize(text) {

    return String(
        text ?? ""
    )
        .toLowerCase()
        .normalize(
            "NFKC"
        );

}


function getTerms() {

    return normalize(
        search.value
    )
        .trim()
        .split(/\s+/)
        .filter(Boolean);

}


function articleSearchText(
    article
) {

    return normalize(
        [
            article.title,
            article.abstract,
            ...article.tags
        ].join(" ")
    );

}

        [];


    terms.forEach(
        term => {

            const rawTerm =
                term.toLowerCase();

            let position =
                0;


            while (true) {

                const index =
                    lowerText.indexOf(
                        rawTerm,
                        position
                    );


                if (
                    index === -1
                ) {

                    break;

                }


                ranges.push(
                    {
                        start:
                            index,

                        end:
                            index
                            + rawTerm.length
                    }
                );


                position =
                    index
                    + rawTerm.length;

            }

        }
    );


    if (
        ranges.length === 0
    ) {

        element.textContent =
            text;

        return;

    }


    ranges.sort(
        (a, b) =>
            a.start
            - b.start
    );


    const merged =
        [];


    ranges.forEach(
        range => {

            const last =
                merged[
                    merged.length - 1
                ];


            if (
                !last
                ||
                range.start
                > last.end
            ) {

                merged.push(
                    {
                        ...range
                    }
                );

            } else {

                last.end =
                    Math.max(
                        last.end,
                        range.end
                    );

            }

        }
    );


    let cursor =
        0;


    merged.forEach(
        range => {

            if (
                range.start
                > cursor
            ) {

                element.appendChild(
                    document.createTextNode(
                        text.slice(
                            cursor,
                            range.start
                        )
                    )
                );

            }


            const mark =
                document.createElement(
                    "mark"
                );


            mark.textContent =
                text.slice(
                    range.start,
                    range.end
                );


            element.appendChild(
                mark
            );


            cursor =
                range.end;

        }
    );


    if (
        cursor
        < text.length
    ) {

        element.appendChild(
            document.createTextNode(
                text.slice(
                    cursor
                )
            )
        );

    }

}

/* =========================================================
   Histogram
========================================================= */

let HISTOGRAM_DATA =
    [];


let histogramSearchKey =
    null;


let histogramPopulationCount =
    ARTICLES.length;


function setDistributionBounds(
    population
) {

    const values =
        population
            .map(
                article =>
                    article.reading_chars
            )
            .filter(
                value =>
                    Number.isFinite(value)
                    &&
                    value > 0
            );


    if (
        values.length
    ) {

        DATA_MIN =
            Math.min(
                ...values
            );


        DATA_MAX =
            Math.max(
                ...values
            );

    } else {

        DATA_MIN =
            0;


        DATA_MAX =
            1;

    }

}


function buildHistogram(
    population = ARTICLES
) {

    HISTOGRAM_DATA =
        [];


    for (
        let i = 0;
        i < HISTOGRAM_BINS;
        i++
    ) {

        const t0 =
            i
            / HISTOGRAM_BINS;


        const t1 =
            (
                i + 1
            )
            / HISTOGRAM_BINS;


        const low =
            Math.round(
                DATA_MIN
                +
                t0
                * (
                    DATA_MAX
                    - DATA_MIN
                )
            );


        const high =
            Math.round(
                DATA_MIN
                +
                t1
                * (
                    DATA_MAX
                    - DATA_MIN
                )
            );


        HISTOGRAM_DATA.push(
            {
                low:
                    low,

                high:
                    high,

                count:
                    0,

                element:
                    null,

                compactElement:
                    null
            }
        );

    }


    population.forEach(
        article => {

            const value =
                article.reading_chars;


            let index =
                Math.floor(
                    charsToSlider(
                        value
                    )
                    / 1000
                    * HISTOGRAM_BINS
                );


            index =
                Math.max(
                    0,
                    Math.min(
                        HISTOGRAM_BINS - 1,
                        index
                    )
                );


            HISTOGRAM_DATA[
                index
            ].count++;

        }
    );


    const maxCount =
        Math.max(
            ...HISTOGRAM_DATA.map(
                bin =>
                    bin.count
            ),
            1
        );


    histogram.innerHTML =
        "";


    HISTOGRAM_DATA.forEach(
        bin => {

            const bar =
                document.createElement(
                    "div"
                );


            bar.className =
                "histogram-bar";


            const height =
                bin.count === 0
                ? 0
                : (
                    bin.count
                    / maxCount
                    * 100
                );


            bar.style.height =
                (
                    bin.count === 0
                    ? 2
                    : Math.max(
                        4,
                        height
                    )
                )
                + "%";


            bar.title =
                formatChars(
                    bin.low
                )
                + " – "
                + formatChars(
                    bin.high
                )
                + ": "
                + bin.count
                + " articles";


            bin.element =
                bar;


            histogram.appendChild(
                bar
            );

        }
    );


    histogramPopulationCount =
        population.length;


    buildCompactHistogram(
        maxCount
    );


    buildAxis();

}


function buildCompactHistogram(
    maxCount
) {

    compactHistogram.innerHTML =
        "";


    HISTOGRAM_DATA.forEach(
        bin => {

            const bar =
                document.createElement(
                    "span"
                );


            const height =
                bin.count === 0
                ? 2
                : Math.max(
                    3,
                    bin.count
                    / maxCount
                    * 100
                );


            bar.style.height =
                height + "%";


            bin.compactElement =
                bar;


            compactHistogram.appendChild(
                bar
            );

        }
    );

}


function updateHistogramForSearch(
    terms
) {

    const key =
        terms.join(
            "\u0000"
        );


    if (
        key === histogramSearchKey
    ) {

        return false;

    }


    const isInitial =
        histogramSearchKey === null;


    histogramSearchKey =
        key;


    const population =
        ARTICLES.filter(
            article => {

                const text =
                    articleSearchText(
                        article
                    );


                return terms.every(
                    term =>
                        text.includes(
                            term
                        )
                );

            }
        );


    setDistributionBounds(
        population
    );


    if (
        !isInitial
    ) {

        rangeMin.value =
            0;


        rangeMax.value =
            1000;


        saveSetting(
            "rangeMin",
            "0"
        );


        saveSetting(
            "rangeMax",
            "1000"
        );

    }


    buildHistogram(
        population
    );


    if (
        !isInitial
    ) {

        updateReadingRange(
            null,
            false
        );

    }


    return true;

}


/* =========================================================
   Axis
========================================================= */

function buildAxis() {

    histogramAxis.innerHTML =
        "";


    const representativeTicks = [
        { value: 500, label: "500" },
        { value: 1000, label: "1k" },
        { value: 2000, label: "2k" },
        { value: 5000, label: "5k" },
        { value: 10000, label: "10k" },
        { value: 20000, label: "20k" },
        { value: 50000, label: "50k" },
        { value: 100000, label: "10万" }
    ];


    const ticks = [
        {
            value: DATA_MIN,
            label: formatChars(DATA_MIN)
        }
    ];


    if (
        DATA_MAX > DATA_MIN
    ) {

        ticks.push(
            ...representativeTicks.filter(
                tick =>
                    tick.value > DATA_MIN
                    &&
                    tick.value < DATA_MAX
            ),
            {
                value: DATA_MAX,
                label: formatChars(DATA_MAX)
            }
        );

    }


    ticks.forEach(
        (tick, index) => {

            const label =
                document.createElement(
                    "span"
                );


            label.textContent =
                tick.label;


            label.style.left =
                charsToSlider(
                    tick.value
                )
                / 10
                + "%";


            if (
                index === 0
            ) {

                label.classList.add(
                    "axis-start"
                );

            }


            if (
                index
                === ticks.length - 1
            ) {

                label.classList.add(
                    "axis-end"
                );

            }


            histogramAxis.appendChild(
                label
            );

        }
    );

}


/* =========================================================
   Reading range
========================================================= */

function getReadingBounds() {

    const minSlider =
        Number(
            rangeMin.value
        );


    const maxSlider =
        Number(
            rangeMax.value
        );


    return {

        min:
            sliderToChars(
                minSlider
            ),

        max:
            sliderToChars(
                maxSlider
            )

    };

}


function updateHistogramSelection(
    bounds
) {

    HISTOGRAM_DATA.forEach(
        bin => {

            const overlaps =
                (
                    bin.high
                    >= bounds.min
                )
                &&
                (
                    bin.low
                    <= bounds.max
                );


            bin.element
                .classList
                .toggle(
                    "selected",
                    overlaps
                );


            bin.element
                .classList
                .toggle(
                    "dim",
                    !overlaps
                );


            if (
                bin.compactElement
            ) {

                bin.compactElement
                    .classList
                    .toggle(
                        "dim",
                        !overlaps
                    );

            }

        }
    );

}


function updateReadingRange(
    source = null,
    triggerUpdate = true
) {

    let minValue =
        Number(
            rangeMin.value
        );


    let maxValue =
        Number(
            rangeMax.value
        );


    /*
    ハンドルが交差しないようにする
    */

    const minimumGap =
        8;


    minValue =
        Math.max(
            0,
            Math.min(
                1000,
                minValue
            )
        );


    maxValue =
        Math.min(
            1000,
            Math.max(
                0,
                maxValue
            )
        );


    if (
        maxValue
        - minValue
        < minimumGap
    ) {

        if (
            source === "min"
        ) {

            minValue =
                Math.max(
                    0,
                    maxValue
                    - minimumGap
                );

        } else {

            maxValue =
                Math.min(
                    1000,
                    minValue
                    + minimumGap
                );


            if (
                maxValue
                - minValue
                < minimumGap
            ) {

                minValue =
                    maxValue
                    - minimumGap;

            }

        }

    }


    rangeMin.value =
        minValue;


    rangeMax.value =
        maxValue;


    const minPercent =
        minValue / 10;


    const maxPercent =
        maxValue / 10;


    rangeSelected.style.left =
        minPercent
        + "%";


    rangeSelected.style.right =
        (
            100
            - maxPercent
        )
        + "%";


    const bounds =
        getReadingBounds();


    if (
        minValue === 0
        &&
        maxValue === 1000
    ) {

        readingRangeText.textContent =
            "すべて";

    } else {

        readingRangeText.textContent =
            formatChars(
                bounds.min
            )
            + " ～ "
            + formatChars(
                bounds.max
            );

    }


    rangeMinValue.textContent =
        formatChars(
            bounds.min
        );


    rangeMaxValue.textContent =
        formatChars(
            bounds.max
        );


    compactRange.textContent =
        readingRangeText.textContent;


    rangeMin.setAttribute(
        "aria-valuetext",
        formatChars(
            bounds.min
        )
    );


    rangeMax.setAttribute(
        "aria-valuetext",
        formatChars(
            bounds.max
        )
    );


    readingRangeLabel.title =
        "コード・数式等を除いた説明文量: "
        + formatChars(bounds.min)
        + " ～ "
        + formatChars(bounds.max);


    /*
    Histogram selection
    */

    updateHistogramSelection(
        bounds
    );


    saveSetting(
        "rangeMin",
        String(
            minValue
        )
    );


    saveSetting(
        "rangeMax",
        String(
            maxValue
        )
    );


    if (
        triggerUpdate
    ) {

        update();

    }

}


/* =========================================================
   Columns
========================================================= */

function updateColumns() {

    const width =
        articlesElement
            .clientWidth;


    if (
        window.innerWidth
        <= 760
    ) {

        document
            .documentElement
            .style
            .setProperty(
                "--columns",
                1
            );


        document
            .documentElement
            .dataset
            .columns =
                "1";


        return;

    }


    const requested =
        Number(
            columns.value
        );


    const possible =
        Math.max(
            1,
            Math.floor(
                (
                    width
                    + GRID_GAP
                )
                /
                (
                    MIN_CARD_WIDTH
                    + GRID_GAP
                )
            )
        );


    const effective =
        Math.max(
            1,
            Math.min(
                requested,
                possible,
                6
            )
        );


    document
        .documentElement
        .style
        .setProperty(
            "--columns",
            effective
        );


    document
        .documentElement
        .dataset
        .columns =
            String(
                effective
            );

}


/* =========================================================
   Search + reading range + sort
========================================================= */

function compareDate(
    a,
    b,
    newestFirst = true
) {

    const ta =
        a.article.timestamp;


    const tb =
        b.article.timestamp;


    if (
        ta === null
        &&
        tb === null
    ) {

        return 0;

    }


    if (
        ta === null
    ) {

        return 1;

    }


    if (
        tb === null
    ) {

        return -1;

    }


    return newestFirst
        ? tb - ta
        : ta - tb;

}


function addFilterChip(

    label,
    onClear
) {

    );

    );


    chip.appendChild(

    );

    );

function updateActiveFilters(
    bounds,
    visible
) {

    activeFilters.innerHTML =
        "";


    stickyStatusFilters.innerHTML =
        "";


    const filters = [];


    const query =
        search.value.trim();


    if (
        query
    ) {

        filters.push({
            label: "検索: " + query,
            onClear: () => {

                search.value =
                    "";


                update();


                search.focus();

            }
        });

    }


    if (
        Number(rangeMin.value) !== 0
        ||
        Number(rangeMax.value) !== 1000
    ) {

        filters.push({
            label: "読み応え: "
            + formatChars(bounds.min)
            + "–"
            + formatChars(bounds.max),
            onClear: () => {

                rangeMin.value =
                    0;


                rangeMax.value =
                    1000;


                updateReadingRange();

            }
        });

    }


    if (
        sort.value
        !== DEFAULTS.sort
    ) {

        filters.push({
            label: "並び順: "
            + SORT_LABELS[sort.value],
            onClear: () => {

                sort.value =
                    DEFAULTS.sort;


                saveSetting(
                    "sort",
                    DEFAULTS.sort
                );


                update();

            }
        });

    }


    filters.forEach(
        filter => {

            addFilterChip(
                activeFilters,
                filter.label,
                filter.onClear
            );


            addFilterChip(
                stickyStatusFilters,
                filter.label,
                filter.onClear
            );

        }
    );


    stickyStatusCount.textContent =
        visible
        + " / "
        + ARTICLES.length;


    activeFilters.classList.toggle(
        "show",
        activeFilters.childElementCount
        > 0
    );


    updateStickyStatusVisibility();

}


function updateStickyStatusVisibility() {

    const show =
        articlesElement
            .getBoundingClientRect()
            .top
        <=
        toolbar
            .getBoundingClientRect()
            .bottom
        + 4;


    stickyStatus.classList.toggle(
        "show",
        show
    );


    stickyStatus.setAttribute(
        "aria-hidden",
        String(!show)
    );

}

function update() {

    const terms =
        getTerms();


    updateHistogramForSearch(
        terms
    );


    const bounds =
        getReadingBounds();


    updateHistogramSelection(
        bounds
    );


    CARD_DATA.sort(
        (a, b) => {

            if (
                sort.value
                === "reading-asc"
            ) {

                return (
                    a.article.reading_chars
                    - b.article.reading_chars
                )
                || compareDate(a, b);

            }


            if (
                sort.value
                === "reading-desc"
            ) {

                return (
                    b.article.reading_chars
                    - a.article.reading_chars
                )
                || compareDate(a, b);

            }


            return compareDate(
                a,
                b,
                sort.value === "new"
            );

        }
    );


    let visible =
        0;


    CARD_DATA.forEach(
        item => {

            const textMatch =
                terms.every(
                    term =>
                        item
                            .element
                            .dataset
                            .search
                            .includes(
                                term
                            )
                );


            const value =
                item.article
                    .reading_chars;


            const readingMatch =
                value
                >= bounds.min
                &&
                value
                <= bounds.max;


            const show =
                textMatch
                &&
                readingMatch;


            item.element.style.display =
                show
                ? ""
                : "none";


            appendHighlightedText(
                item.titleText,
                item.article.title,
                terms
            );


            appendHighlightedText(
                item.abstractText,
                item.article.abstract,
                terms
            );


            articlesElement.appendChild(
                item.element
            );


            if (
                show
            ) {

                visible++;

            }

        }
    );


    count.textContent =
        visible
        + " / "
        + ARTICLES.length
        + " articles";


    histogramCount.textContent =
        "検索結果 "
        + histogramPopulationCount
        + "件の分布 · 選択範囲内 "
        + visible
        + "件";


    compactCount.textContent =
        visible + "件";


    updateActiveFilters(
        bounds,
        visible
    );


    empty.classList.toggle(
        "show",
        visible === 0
    );

}

    );


    readingToggle.title =
        collapsed
        ? "読み応えフィルタを展開"
        : "読み応えフィルタを折りたたむ";


    saveSetting(
        "readingCollapsed",
        String(collapsed)
    );

}

function setAbstract(
    enabled
) {

    abstractToggle.checked =
        enabled;


    document.body
        .classList
        .toggle(
            "hide-abstract",
            !enabled
        );


    saveSetting(
        "abstract",
        String(
            enabled
        )
    );

}


function setMeta(
    enabled
) {

    metaToggle.checked =
        enabled;


    document.body
        .classList
        .toggle(
            "hide-meta",
            !enabled
        );


    saveSetting(
        "meta",
        String(
            enabled
        )
    );

}


/* =========================================================
   Events
========================================================= */

search.addEventListener(
    "input",
    update
);


abstractToggle.addEventListener(
    "change",
    () => {

        setAbstract(
            abstractToggle.checked
        );

    }
);


metaToggle.addEventListener(
    "change",
    () => {

        setMeta(
            metaToggle.checked
        );

    }
);


rangeMin.addEventListener(
    "input",
    () => {

        updateReadingRange(
            "min"
        );

    }
);


rangeMax.addEventListener(
    "input",
    () => {

        updateReadingRange(
            "max"
        );

    }
);


readingReset.addEventListener(
    "click",
    () => {

        rangeMin.value =
            0;


        rangeMax.value =
            1000;


        updateReadingRange();

    }
);


readingToggle.addEventListener(
    "click",
    () => {

        setReadingCollapsed(
            !readingExplorer
                .classList
                .contains(
                    "collapsed"
                )
        );

    }
);


columns.addEventListener(
    "change",
    () => {

        saveSetting(
            "maxColumns",
            columns.value
        );


        updateColumns();

    }
);


sort.addEventListener(
    "change",
    () => {

        saveSetting(
            "sort",
            sort.value
        );


        update();

    }
);


reset.addEventListener(
    "click",
    () => {

        search.value =
            "";


        rangeMin.value =
            0;


        rangeMax.value =
            1000;


        columns.value =
            DEFAULTS.maxColumns;


        sort.value =
            DEFAULTS.sort;


        setAbstract(
            DEFAULTS.abstract
        );


        setMeta(
            DEFAULTS.meta
        );


        saveSetting(
            "maxColumns",
            DEFAULTS.maxColumns
        );


        saveSetting(
            "sort",
            DEFAULTS.sort
        );


        updateReadingRange();


        updateColumns();


        update();


        search.focus();

    }
);


/* =========================================================
   Search shortcut
========================================================= */

document.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "/"
            &&
            document.activeElement
            !== search
        ) {

            event.preventDefault();


            search.focus();

        }

    }
);


/* =========================================================
   Back to top
========================================================= */

window.addEventListener(
    "scroll",
    () => {

        backTop.classList.toggle(
            "show",
            window.scrollY > 500
        );


        updateStickyStatusVisibility();

    }
);


backTop.addEventListener(
    "click",
    () => {

        window.scrollTo(
            {
                top: 0,
                behavior: "smooth"
            }
        );

    }
);


/* =========================================================
   Resize
========================================================= */

if (
    "ResizeObserver"
    in window
) {

    const observer =
        new ResizeObserver(
            () => {

                updateColumns();

            }
        );


    observer.observe(
        articlesElement
    );

}


window.addEventListener(
    "resize",
    () => {

        updateColumns();


        updateStickyStatusVisibility();

    }
);


/* =========================================================
   Restore settings
========================================================= */

const storedAbstract =
    loadSetting(
        "abstract",
        String(
            DEFAULTS.abstract
        )
    ) === "true";


const storedMeta =
    loadSetting(
        "meta",
        String(
            DEFAULTS.meta
        )
    ) === "true";


const storedColumns =
    loadSetting(
        "maxColumns",
        DEFAULTS.maxColumns
    );


const storedSort =
    loadSetting(
        "sort",
        DEFAULTS.sort
    );


const storedRangeScale =
    loadSetting(
        "rangeScale",
        ""
    );


const storedRangeMin =
    storedRangeScale === RANGE_SCALE_VERSION
    ? loadSetting(
        "rangeMin",
        DEFAULTS.rangeMin
    )
    : DEFAULTS.rangeMin;


const storedRangeMax =
    storedRangeScale === RANGE_SCALE_VERSION
    ? loadSetting(
        "rangeMax",
        DEFAULTS.rangeMax
    )
    : DEFAULTS.rangeMax;


const storedReadingCollapsed =
    loadSetting(
        "readingCollapsed",
        String(
            DEFAULTS.readingCollapsed
        )
    ) === "true";


setAbstract(
    storedAbstract
);


setMeta(
    storedMeta
);


setReadingCollapsed(
    storedReadingCollapsed
);


const safeStoredColumns =
    storedColumns;


if (
    [
        "1",
        "2",
        "3",
        "4",
        "5",
        "6"
    ].includes(
        safeStoredColumns
    )
) {

    columns.value =
        safeStoredColumns;


}


if (
    [
        "new",
        "old",
        "reading-asc",
        "reading-desc"
    ].includes(
        storedSort
    )
) {

    sort.value =
        storedSort;

}


rangeMin.value =
    Math.max(
        0,
        Math.min(
            1000,
            Number(
                storedRangeMin
            )
        )
    );


rangeMax.value =
    Math.max(
        0,
        Math.min(
            1000,
            Number(
                storedRangeMax
            )
        )
    );


saveSetting(
    "rangeScale",
    RANGE_SCALE_VERSION
);


/* =========================================================
   Initial render
========================================================= */

updateReadingRange();


requestAnimationFrame(
    updateColumns
);

</script>

</body>

</html>
